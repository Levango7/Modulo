<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Modulo 图标（2026-11-23 换色 + 三色一笔，第三十七笔）：墨绿圆角方底 + 三色拼一笔 M。
      · 底 #2E8F79：出厂皮肤「素纸」强调色 #3a7062 的展示档 —— 图标与默认界面同色族
        （第一版朱砂底是 ink 皮肤族、与出厂界面脱节，且橙色域撞小米，2026-11-23 换色）。
      · M 保持一笔几何（第三十六笔的形），分三段上色：左腿白、中缝 V 朱砂 #E4572E
        （动感位 —— 用户点名借优酷箭头的块面节奏）、右腿浅绿 #8FCDBB；三段在顶部
        圆头相融，V 骑在两腿上，读 M 不读 H（中缝是真斜线连接）。
      · 多色是用户 2026-11-23 反馈「M 不要这么简单，用多种颜色拼一下」的迭代；
        九块色带版实渲对比后落选（竖块中缝掉了动势，0.8.9 旧稿同款教训）。
    2026-11-28 视觉刀 1（视觉重构第一刀·二）：四段分笔加缝 —— 上面的「三色一笔」几何
      就此作废，M 重画为左腿白 / 左斜 #F6B39B / 右斜 #bfeadb / 右腿白四段独立描边，
      段与段端点不共点、笔间留缝，缝宽 ≈ 两段端点间距 25-30 单位（×42.67 后即 30/60 的
      端点错位），寓意「模块拼合成整体」。几何沿用评审通过的原型：24 格等比 ×42.67
      映射到 1024，stroke-width 115 ≈ 2.7×42.67，stroke-linecap round、不 fill；
      底 rect 与 rx 224 不动。
      与页面 BrandMark 同形：BrandMark.vue 同步改成同一套四段（viewBox 24），并改用
      固定品牌色 —— 上面「应用内标识随皮肤变 --accent」的旧关系就此作废（2026-11-28
      刀 1 裁决，见该文件头注释）。
    public/favicon.svg 是本文件的逐字节副本（tests/assets/favicon.test.ts 钉住）。
  -->
  <rect width="1024" height="1024" rx="224" fill="#2E8F79"/>
  <g fill="none" stroke-width="115" stroke-linecap="round">
    <path d="M238 801V273" stroke="#FFFFFF"/>
    <path d="M268 307 481 554" stroke="#F6B39B"/>
    <path d="M541 554 754 307" stroke="#bfeadb"/>
    <path d="M785 801V273" stroke="#FFFFFF"/>
  </g>
</svg>
