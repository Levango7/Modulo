<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Modulo 图标（2026-11-23 换色 + 多色拼 M）：墨绿圆角方底 + 三色四段 M。
      · 底 #2E8F79：出厂皮肤「素纸」强调色 #3a7062 的展示档 —— 图标与默认界面同色族
        （第一版朱砂底是 ink 皮肤族、与出厂界面脱节，且橙色域撞小米，2026-11-23 换色）。
      · 多色是用户 2026-11-23 反馈「M 不要这么简单，用多种颜色拼一下」的迭代。
    2026-11-28 视觉刀 1（视觉重构第一刀·二）：M 画为左腿白 / 左斜 #F6B39B / 右斜 #bfeadb /
      右腿白四段独立描边，段与段端点不共点、笔间留缝，寓意「模块拼合成整体」。
      真实几何（1024 格；底 rect #2E8F79 rx224 不动；stroke-linecap round、不 fill；
      stroke-width 88）：左腿 M190 815V255、左斜 M308 310 462 565、右斜 M562 565 716 310、
      右腿 M834 815V255，腿高 255–815。
      缝宽核算：腿-斜水平缝 = 308−190−88 = 30；顶点缝 = 562−462−88 = 12。
      （2026-11-28 reviewer 必须修 #2：初稿 stroke-width 115（半宽 57.5）大于段间端点
       错位 30–60，墨迹全部重叠、缝在数学上不存在，本稿按 88 重算落定。）
    与页面 BrandMark 同形：BrandMark.vue 同步同一套四段（viewBox 24 = 1024 格 ÷42.67），
      并改用固定品牌色 —— 上面「应用内标识随皮肤变 --accent」的旧关系就此作废
      （2026-11-28 刀 1 裁决，见该文件头注释）。
    public/favicon.svg 是本文件的逐字节副本（tests/assets/favicon.test.ts 钉住）。
  -->
  <rect width="1024" height="1024" rx="224" fill="#2E8F79"/>
  <g fill="none" stroke-width="88" stroke-linecap="round">
    <path d="M190 815V255" stroke="#FFFFFF"/>
    <path d="M308 310 462 565" stroke="#F6B39B"/>
    <path d="M562 565 716 310" stroke="#bfeadb"/>
    <path d="M834 815V255" stroke="#FFFFFF"/>
  </g>
</svg>
