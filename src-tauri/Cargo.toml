[package]
name = "modulo"
version = "0.7.2"
description = "Modulo 桌面壳"
license = "Apache-2.0"
edition = "2021"
# 1.77 → 1.90：tauri-plugin-updater / -process 的稳定版都要求 1.90（cargo add 会因这条声明
# 悄悄回退到 2.0.0-rc 古董版，别让它得逞）。本机 1.97.1、CI 的 stable 都满足。
rust-version = "1.90"

[lib]
name = "modulo_lib"
# 模板给的 staticlib/cdylib 是给移动端的，本项目只有桌面端。留着会让 `cargo test` 顺带链一次
# debug 版 cdylib：windows-gnu 下它的导出表能到 9.4 万条（超 PE 的 65535 序号上限），
# dlltool/ld 直接报 export ordinal too large —— 本机 `cargo test` 因此从来没通过过。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
# 别当"未使用"删掉：tauri.conf.json 里有 `plugins` 段之后，`generate_context!` 生成的
# 插件配置解析代码会在 app crate 根上引用 `serde_json`，删了就编译不过（E0433）。
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true

[dev-dependencies]
# 发布门禁测试（tests/release_signature.rs）用：与 tauri-plugin-updater **同一套实现**，
# 不是另写一套自娱自乐 —— 判定口径逐行对应插件的 verify_signature()。
minisign-verify = "0.2"
base64 = "0.22"

# 测试二进制不带完整调试信息。
#
# 背景：这台机器上 `cargo test` 产出的 lib 测试壳会启动即退 0xC0000139
# （STATUS_ENTRYPOINT_NOT_FOUND），且触发点无法预测 —— 已定位过一次真凶是某段
# 无害代码（`chars().take().collect::<String>()`），换掉就好了；但之后每加一段
# 常规代码又会复现。体积 / incremental / 静态导入 / DLL 位置 / PATH 版本 /
# 产物损坏全部排除过，机制仍未查明（CI 的 windows-latest 上一直正常）。
#
# 断点调试走 `[profile.dev]`（IDE 调试用的是 dev profile，不受这里影响）；
# 测试二进制只需要能跑起来，不需要 DWARF。
[profile.test]
debug = 1
