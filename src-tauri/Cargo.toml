[package]
name = "modulo"
version = "0.5.0"
description = "Modulo 桌面壳"
license = "Apache-2.0"
edition = "2021"
# 1.77 → 1.90：tauri-plugin-updater / -process 的稳定版都要求 1.90（cargo add 会因这条声明
# 悄悄回退到 2.0.0-rc 古董版，别让它得逞）。本机 1.97.1、CI 的 stable 都满足。
rust-version = "1.90"

[lib]
name = "modulo_lib"
# 模板给的 staticlib/cdylib 是给移动端的，本项目只有桌面端。留着会让 `cargo test` 顺带链一次
# debug 版 cdylib：windows-gnu 下它的导出表能到 9.4 万条（超 PE 的 65535 序号上限），
# dlltool/ld 直接报 export ordinal too large —— 本机 `cargo test` 因此从来没通过过。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
# 别当"未使用"删掉：tauri.conf.json 里有 `plugins` 段之后，`generate_context!` 生成的
# 插件配置解析代码会在 app crate 根上引用 `serde_json`，删了就编译不过（E0433）。
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true

[dev-dependencies]
# 发布门禁测试（tests/release_signature.rs）用：与 tauri-plugin-updater **同一套实现**，
# 不是另写一套自娱自乐 —— 判定口径逐行对应插件的 verify_signature()。
minisign-verify = "0.2"
base64 = "0.22"
