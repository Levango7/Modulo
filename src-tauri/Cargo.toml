[package]
name = "modulo"
version = "0.3.0"
description = "Modulo 桌面壳"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "modulo_lib"
# 模板给的 staticlib/cdylib 是给移动端的，本项目只有桌面端。留着会让 `cargo test` 顺带链一次
# debug 版 cdylib：windows-gnu 下它的导出表能到 9.4 万条（超 PE 的 65535 序号上限），
# dlltool/ld 直接报 export ordinal too large —— 本机 `cargo test` 因此从来没通过过。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
