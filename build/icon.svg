<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Modulo 图标（2026-11-23 换色 + 三色一笔，第三十七笔）：墨绿圆角方底 + 三色拼一笔 M。
      · 底 #2E8F79：出厂皮肤「素纸」强调色 #3a7062 的展示档 —— 图标与默认界面同色族
        （第一版朱砂底是 ink 皮肤族、与出厂界面脱节，且橙色域撞小米，2026-11-23 换色）。
      · M 保持一笔几何（第三十六笔的形），分三段上色：左腿白、中缝 V 朱砂 #E4572E
        （动感位 —— 用户点名借优酷箭头的块面节奏）、右腿浅绿 #8FCDBB；三段在顶部
        圆头相融，V 骑在两腿上，读 M 不读 H（中缝是真斜线连接）。
      · 多色是用户 2026-11-23 反馈「M 不要这么简单，用多种颜色拼一下」的迭代；
        九块色带版实渲对比后落选（竖块中缝掉了动势，0.8.9 旧稿同款教训）。
      · 与 src/vue/components/BrandMark.vue 的关系：应用内标识仍是单色 --accent 描边
        （随皮肤变色是设计内）；三色是图标位的展示档。
    public/favicon.svg 是本文件的逐字节副本（tests/assets/favicon.test.ts 钉住）。
  -->
  <rect width="1024" height="1024" rx="224" fill="#2E8F79"/>
