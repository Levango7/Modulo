name: CI

# sherpa-onnx 预编译库的出处与校验和（R-01 供应链）：desktop 与 release 两个 job 共用。
# **版本一升，这三行必须同步改**（URL 与校验和是绑死的，漏改一处就是下载到别人那份）。
#
# 为什么是我们自己取、而不是让 crate 的 build.rs 自己下：build.rs 找不到本地库就去
# GitHub 现下 —— CI 上当然下得动，但**没有校验的下载等于供应链裸奔**，而且每次构建都重下。
# 为什么是共享档（8MB）而不是 crate 默认的静态档（123MB）：Windows x64 只有 MSVC
# 货，静态档是 13 个 MSVC `.lib` + 123MB，共享档是 4 个 DLL + 3 个 `.lib` + 8MB（见 D-14）。
#
# ── 2026-10-16：交给 build.rs 的东西从「归档目录」换成「解压好的 lib 目录」──
# 上一版只设 `SHERPA_ONNX_ARCHIVE_DIR`，让 build.rs 自己去解压。它在 run 38794574273 的
# 桌面壳 job 上红了：`LNK1181: cannot open input file 'sherpa-onnx-c-api.lib'`，
# 而 linker 的 `/LIBPATH` 明确指向 `target/sherpa-onnx-prebuilt/<stem>/lib` ——
# **目录在，里面的 `.lib` 不在**。成因是那条路上有个「把目录在不在当成内容全不全」的假设：
# build.rs 的 `if lib_dir.is_dir() { return }`（sherpa-onnx-sys 1.13.8 `build.rs:167`）
# 见到目录就直接用它、跳过解压，而 `target/` 恰好被 rust-cache 恢复成一份**不完整**的解压目录。
# 改用 `SHERPA_ONNX_LIB_DIR`（build.rs 里优先级最高、**完全不经过 `target/`** 的那条分支）
# 之后，缓存怎么删都影响不到它；取件步骤自己解压，并把「7 个文件齐不齐」变成一句人话。
# 布局是本地实测的（用 runner 同族的 `C:\Windows\System32\tar.exe -xjf`）：
# 解压出来是 `<stem>/lib/`，里面正好 3 个导入库 + 4 个运行时 DLL。
env:
  SHERPA_ONNX_VERSION: '1.13.8'
  SHERPA_ONNX_ARCHIVE: sherpa-onnx-v1.13.8-win-x64-shared-MT-Release-lib.tar.bz2
  SHERPA_ONNX_ARCHIVE_SHA256: b8eedf41bd6d3779218887b48367bb7a3ece5aaa7667f01f69ee823a12b0a9e7

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布标签，如 v0.5.0（不填则仅跑常规 CI，不打安装包）'
        required: false
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 2026-10-22：显式声明 —— 发布点门禁要读 releases / rulesets；
    # 此前 job 没声明，靠仓库默认（read）兜着，叠加到 push 上下文时
    # releases 列表偶发读到空数组，门禁把"读不到"误报成"15 个 release 全没了"。
    permissions:
      contents: read
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      # fetch-depth: 0 —— 浅克隆（默认 depth=1）下 `HEAD~1` 与 `origin/master` 都不存在，
      # 协调板门禁的判据 2 每次都会吐一条「拿不到本次提交的改动清单」。
      # **永远消不掉的警告比没有警告更糟**（这条已写进 `coord-gate.mjs` 判据 3 的注释里）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 协调板登记门禁。判据 2（动了产品面却没在板上登记）与判据 4（临时脚本被 git 跟踪）会失败。
      #
      # **2026-10-10 才真正接上**：`bbfa4ec`（#26）只加了 `scripts/coord-gate.mjs`，
      # 从来没有在这里调用过 —— 也就是说它一直是条**永远绿的检查**（不跑 = 不红），
      # 而板上此前那些「coord-gate 0 警告」全是本机手跑的结果。放在最前面跑：
      # 卫生类判据几秒就能红，不必让人等完 5 分钟的构建才看到。
      - name: 协调板登记门禁（未登记改动 / 临时脚本入库 → 红）
        env:
          COORD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/coord-gate.mjs
      # Chrome 存在性断言（2026-10-20 全仓盘点折入）。
      # 为什么需要：E2E 与拖拽预算都是 skipIf(!EXE) 形状 —— Chrome 缺失时整段静默跳过、
      # job 全绿。本机实测过一次：2026-10-19 04:0x 的 run 39004860377 十分多钟全绿，
      # 而两条 E2E + 拖拽预算一步都没跑。"没测"不许冒充"测过"。
      # dist/ 要等构建才有，所以断言放在构建前：CHROME_PATH 指不到文件就让本 job 当场红。
      - name: Chrome 存在性断言（E2E / 拖拽预算不许静默跳过）
        run: test -f "$CHROME_PATH"
      # 网络策略单源门禁（2026-10-22 接上，F-07）。
      #
      # 断言 `net-policy.json`（唯一真源）与三侧消费一致：引擎的生成产物
      # `packages/engine/src/netPolicy.generated.ts`、Rust 的 `src-tauri/src/net_policy.rs`
      # 及其四个消费点、以及 `src-tauri/tauri.conf.json` 里两条 CSP 的 `connect-src`。
      #
      # 为什么需要它：这些数字此前散在六处、靠注释维系同源，已经出过两次事 ——
      # ① `http.ts` 注释写「沿用 net.rs（1 MiB / 5s）」而 `net.rs` 实际是 10s；
      # ② CSP 的 `connect-src` 漏了 `https://push2.eastmoney.com`（`stock.ts` 的 `QUOTES_URL`），
      # 桌面壳里股票卡取数被 CSP 实拦，而网页版没有 CSP，所以一直没暴露。
      # 注释维系同源 = 没有任何机器保证，这道门把"有没有漂移"变成可断言的事。
      #
      # 位置在类型检查**之后**：它读的是源文件与配置，不需要构建产物；排在构建前面
      # 能在几分钟的构建之前就把漂移红了。
      - name: 网络策略单源一致性（net-policy.json → TS / Rust / CSP）
        run: node scripts/net-policy-check.mjs
      - name: 类型检查
        run: npm run typecheck
      - name: 单测 + 投影属性测试（受测层分支覆盖 ≥90% 门禁）
        run: npm run cover:engine
      - name: 构建
        run: npm run build
      # 「抽包」的承诺是"可分发的资产"，不是"目录挪了个位置" —— 包必须能独立构建。
      # 不构建的话 dist/ 永远是空的，等真发 npm 包（prepack 会构建）才发现问题太晚。
      - name: 引擎包独立构建（@levango7/engine）
        run: npm run engine:build
      # 与 x-hub 的反面教材相对：它写了 164 个 Rust 测试，但 CI 只跑 vue-tsc + cargo check，一个测试都不执行
      - name: 浏览器交互 E2E（拖拽 / 框选 / 键盘 / 撤销 / 三档视口）
        run: npm run test:e2e

      # 拖拽的**计数型**预算门禁（2026-10-12 接上）。
      #
      # 为什么不靠 E2E 里那条 §8 帧率门禁：那条断言是"连拖期间帧距中位数 ≤ 18.2ms"，
      # 而 headless 的 rAF 被钉在 60Hz（实测 median=16.7ms / p95=16.7ms），它量的是**节拍**、
      # 不是**成本** —— 只有成本逼近 16.7ms 才翻红。实测背景：一次"每帧全量重排"的退化把
      # 主线程从 2.85ms/帧 拉到 8ms/帧（四倍），那条门禁全程一声不吭。而且只看中位数，
      # 对"卡顿感"所在的尾部无感。
      #
      # 这条改量 Blink 自己的计数器：`LayoutCount / pointermove` 与 `RecalcStyleCount / pointermove`。
      # 数字是**确定性**的（同产物连跑三轮逐字一致），跨机器一致，不会因为 runner 忙而假红。
      # 实测两端：每帧重排时 1.00 次/move（红），修好之后 0.05 次/move（绿），预算 0.5。
      #
      # 位置在 E2E **之后**：它要 dist/，而 E2E 的 globalSetup 会以 production 重建一遍
      # （vitest.e2e.setup.ts），所以排在这里量到的是要发出去的那份产物。
      # 没有 Chrome 时脚本自己跳过（与 E2E 的 `skipIf(!EXE)` 同一条约定：假红比没门禁更糟）。
      - name: 拖拽预算（每次 move 不许重排版面 —— 计数型，与刷新率无关）
        run: npm run drag:budget

      # 文档里的规模数字是人抄的，抄错不会让任何测试变红 —— 所以让机器核对。
      # 只认显式标记过的行（`<!-- facts -->`），历史数字与说明段不会被误判。
      # 量的是 dist/ 与 coverage/：coverage 来自上面的门禁步骤；dist 由「构建」产出，
      # 而 E2E 的 globalSetup 又以 production 重建了一遍（vitest.e2e.setup.ts），
      # 所以排在 E2E 之后量到的仍是生产产物。
      - name: 文档数字核对（认领了规模数字的行必须与实跑一致）
        run: npm run docs:check

      # 发布点门禁：验 `v*` tag 的 ruleset 还在、资产字节没变、tag 没被改指。
      # 放在 verify 这个 job 里而不是新开一个 —— master 的 required checks 认的是
      # `verify` 与 `桌面壳` 这两个 context，加 job 就得同步改 ruleset，多一处能忘的地方。
      # 没有 token 时脚本会直接判失败（拒绝假装通过），所以这里不设 continue-on-error。
      # token 必须显式传：Actions **不会**自动把 `github.token` 放进 `GITHUB_TOKEN` 环境变量，
      # 漏了这一行这道门禁会在 CI 上一直红 —— 而那正是它自己的设计（读不到就拒绝通过）。
      - name: 发布点门禁（tag 规则集 / 资产字节 / 出处台账）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-manifest.mjs

  # 桌面壳单独一个 job：它要 Windows runner，跑挂了不该把前端那条链一起标红，反之亦然。
  # 用了两个第三方 action（rust-toolchain / rust-cache），都是事实标准；如果不接受这个依赖，
  # 去掉 rust-cache 只是变慢，去掉 rust-toolchain 则要确认 runner 预装的工具链带 clippy+rustfmt。
  desktop:
    name: 桌面壳（Rust 门禁 + 真打包）
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 取 sherpa-onnx 预编译库（sha256 校验 → 解压 → SHERPA_ONNX_LIB_DIR）
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'sherpa'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $file = Join-Path $dir $env:SHERPA_ONNX_ARCHIVE
          $url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$env:SHERPA_ONNX_VERSION/$env:SHERPA_ONNX_ARCHIVE"
          Invoke-WebRequest -Uri $url -OutFile $file
          $got = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
          if ($got -ne $env:SHERPA_ONNX_ARCHIVE_SHA256) {
            Write-Error "sherpa-onnx 归档 sha256 不匹配（期望 $env:SHERPA_ONNX_ARCHIVE_SHA256，实际 $got）"
            exit 1
          }
          tar -xjf $file -C $dir
          if ($LASTEXITCODE -ne 0) { Write-Error "解压 sherpa-onnx 归档失败（tar 退出码 $LASTEXITCODE）"; exit 1 }
          $lib = Join-Path (Join-Path $dir ($env:SHERPA_ONNX_ARCHIVE -replace '\.tar\.bz2$', '')) 'lib'
          # 这 7 个必须齐（3 导入库 + 4 运行时 DLL，清单由来见文件头 D-14）。缺 `.lib` 时
          # build.rs 一声不吭，会拖到几十秒后以 linker 的 LNK1181 冒出来，看日志的人无从下手。
          $need = @('sherpa-onnx-c-api.lib', 'sherpa-onnx-cxx-api.lib', 'onnxruntime.lib',
                    'sherpa-onnx-c-api.dll', 'sherpa-onnx-cxx-api.dll', 'onnxruntime.dll',
                    'onnxruntime_providers_shared.dll')
          $missing = $need | Where-Object { -not (Test-Path (Join-Path $lib $_)) }
          if ($missing) { Write-Error "sherpa-onnx 解压后缺少：$($missing -join '、')（目录 $lib）"; exit 1 }
          # build.rs 里优先级最高的那条分支：指到哪用哪，**完全不经过 target/**（理由见文件头）
          "SHERPA_ONNX_LIB_DIR=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm ci
      # 安装包必须带 sherpa 的 4 个运行时 DLL：exe 静态依赖它们，缺了装完起不来
      # （2026-10-22 本机探针实测 0xC0000135）。bundle.resources 只认构建时存在的相对路径，
      # 所以先把它们从 SHERPA_ONNX_LIB_DIR 复制进 src-tauri（该目录已 gitignore）。
      - name: 复制 sherpa 运行时 DLL 进 src-tauri（bundle.resources 的源目录）
        shell: pwsh
        run: |
          $dst = Join-Path $PWD 'src-tauri/sherpa-dlls'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $need = @('sherpa-onnx-c-api.dll', 'sherpa-onnx-cxx-api.dll', 'onnxruntime.dll', 'onnxruntime_providers_shared.dll')
          foreach ($n in $need) {
            Copy-Item (Join-Path $env:SHERPA_ONNX_LIB_DIR $n) (Join-Path $dst $n) -Force
          }
          Get-ChildItem $dst | Select-Object Name, Length
      - name: 格式检查
        working-directory: src-tauri
        run: cargo fmt --check
      - name: clippy（warning 即失败）
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust 单测（数据文件名的白名单在这里）
        working-directory: src-tauri
        run: cargo test
      - name: 打包出 exe（不打安装包）
        run: npx tauri build --no-bundle
      # 桌面自检探针**不在 CI 跑**（挂过一次，摘了）。实测原因：runner 上 WebView2 的 loader
      # 不把 WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS 写进浏览器进程 —— 6 条 msedgewebview2 命令行
      # 0 条带 --remote-debugging-port（runtime 153.0.4234.48），本机同一颗 exe 是 154.0.4258.53、
      # 命令行带参数且端口可达。于是探针每次都停在"连 CDP"这一步，与产品好坏无关，
      # 留着的价值只是一个不会拦任何东西的红叉。
      # 它的定位是**发布前的本机门禁**：跑在要发出去的那颗二进制上（§11.4），CI 管构建与单测。
      - uses: actions/upload-artifact@v4
        with:
          name: modulo-windows-x64-exe
          path: src-tauri/target/release/modulo.exe
          if-no-files-found: error

  # 发布：打 v* 标签（或手动触发 workflow_dispatch + 有 release-tag 输入）才跑。
  # 设计意图：PR/分支推送**不打安装包**（那一步要 30+ 分钟），只走 verify/desktop；
  # 打 tag 才走 release，把安装包 + 签名 + 更新清单一起产出并挂到 GitHub Release。
  release:
    name: 发布（v* 标签）
    # 只有 tag 推送（或手动触发且显式填了 release_tag）才进来；PR 与分支推送都不跑
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: windows-latest
    timeout-minutes: 60
    # 需要写权限才能用 gh 创建 Release；Secrets 里得先配 TAURI_SIGNING_PRIVATE_KEY。
    # `id-token: write` 是给 npm 的 OIDC 用的：2026-10-20 起它一身二责 ——
    # ① trusted publishing 的**发布认证**（换一张短命令牌，npm 侧核对 workflow 身份）；
    # ② provenance：让 npm 自己签一份"这个包确实从这个仓库的这次 CI 构建出来"的证明，附在包上。
    # 少于这个权限时 `npm publish --provenance` 会直接失败。
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # 只在**这个 job** 里声明 registry-url：`npm publish` 要知道往哪发。
          # 2026-10-20 起认证走 OIDC（trusted publishing），不再有 NODE_AUTH_TOKEN ——
          # setup-node 写在 .npmrc 里的那行 `_authToken` 会是空的，发布时 npm 自动
          # 改用 OIDC 换票（要 npm ≥ 11.5.1，见下面「升级 npm」那步）。
          # 为什么不把这一行写进仓库那份 .npmrc：那是**每台机器都会读**的文件，
          # 不该让本地 `npm install` 也去解析一个只属于 CI 的 registry 配置。
          registry-url: https://registry.npmjs.org

      # ── 发版门禁：CI 没绿，不许发（2026-10-12 接上）──────────────────────────────
      #
      # 实跑出来的事实（2026-10-04 复核）：v0.4.0 那次 CI `failure 10:00:12`，
      # Release 在 `10:00:50` 就建好了 —— 差 38 秒。五次发版里唯一一次红灯是运气，
      # 前四次也没等 CI，只是恰好都绿。病根不是"人没看 CI"，是**发布链路与 CI 之间
      # 没有依赖关系**：tag 一推、Release 一建就完事，CI 挂在旁边观察，对结果没有否决权。
      #
      # 为什么不能靠 `needs: verify`：release 由 **tag push** 触发，和 verify 是两条独立的
      # workflow run；`needs` 只表达同一条 workflow 内 job 之间的先后，管不到"这个 commit
      # 上一轮 CI 绿不绿"。所以只能由这道门按 commit sha 回头查结论 —— 它看得见历史 run。
      #
      # 排在最前面是省钱：出安装包要 30+ 分钟，注定失败的发版不该占满 runner。
      # 它**不认 pending** —— "还没出结论"不等于"通过"，刚合完就打 tag 会被挡，这是设计。
      # 当前这条 run 由脚本自己按 GITHUB_RUN_ID 排除（否则它永远判自己"还在跑"，门永远红）。
      - name: 发版门禁（该 tag 的 CI 没绿 → 直接失败，不许发）
        env:
          # 不传也能查（公开仓库），但匿名只有 60 req/h；显式传是 5000 req/h
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-gate.mjs --tag ${{ github.event.inputs.release_tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 取 sherpa-onnx 预编译库（sha256 校验 → 解压 → SHERPA_ONNX_LIB_DIR）
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'sherpa'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $file = Join-Path $dir $env:SHERPA_ONNX_ARCHIVE
          $url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$env:SHERPA_ONNX_VERSION/$env:SHERPA_ONNX_ARCHIVE"
          Invoke-WebRequest -Uri $url -OutFile $file
          $got = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
          if ($got -ne $env:SHERPA_ONNX_ARCHIVE_SHA256) {
            Write-Error "sherpa-onnx 归档 sha256 不匹配（期望 $env:SHERPA_ONNX_ARCHIVE_SHA256，实际 $got）"
            exit 1
          }
          tar -xjf $file -C $dir
          if ($LASTEXITCODE -ne 0) { Write-Error "解压 sherpa-onnx 归档失败（tar 退出码 $LASTEXITCODE）"; exit 1 }
          $lib = Join-Path (Join-Path $dir ($env:SHERPA_ONNX_ARCHIVE -replace '\.tar\.bz2$', '')) 'lib'
          # 这 7 个必须齐（3 导入库 + 4 运行时 DLL，清单由来见文件头 D-14）。缺 `.lib` 时
          # build.rs 一声不吭，会拖到几十秒后以 linker 的 LNK1181 冒出来，看日志的人无从下手。
          $need = @('sherpa-onnx-c-api.lib', 'sherpa-onnx-cxx-api.lib', 'onnxruntime.lib',
                    'sherpa-onnx-c-api.dll', 'sherpa-onnx-cxx-api.dll', 'onnxruntime.dll',
                    'onnxruntime_providers_shared.dll')
          $missing = $need | Where-Object { -not (Test-Path (Join-Path $lib $_)) }
          if ($missing) { Write-Error "sherpa-onnx 解压后缺少：$($missing -join '、')（目录 $lib）"; exit 1 }
          # build.rs 里优先级最高的那条分支：指到哪用哪，**完全不经过 target/**（理由见文件头）
          "SHERPA_ONNX_LIB_DIR=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm ci
      # 安装包必须带 sherpa 的 4 个运行时 DLL：exe 静态依赖它们，缺了装完起不来
      # （2026-10-22 本机探针实测 0xC0000135）。bundle.resources 只认构建时存在的相对路径，
      # 所以先把它们从 SHERPA_ONNX_LIB_DIR 复制进 src-tauri（该目录已 gitignore）。
      - name: 复制 sherpa 运行时 DLL 进 src-tauri（bundle.resources 的源目录）
        shell: pwsh
        run: |
          $dst = Join-Path $PWD 'src-tauri/sherpa-dlls'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $need = @('sherpa-onnx-c-api.dll', 'sherpa-onnx-cxx-api.dll', 'onnxruntime.dll', 'onnxruntime_providers_shared.dll')
          foreach ($n in $need) {
            Copy-Item (Join-Path $env:SHERPA_ONNX_LIB_DIR $n) (Join-Path $dst $n) -Force
          }
          Get-ChildItem $dst | Select-Object Name, Length

      # 版本号对齐先挡一次：tag 必须等于 package.json 里的版本，否则 `make-latest-json`
      # 的 signedVersion 校验也会在出清单前挡。这里少挡一层就是发布一个张冠李戴的版本。
      # 2026-10-09 起多查一处 `packages/engine/package.json` —— 那个包现在会随 tag 发到 npm，
      # 而 npm **同一个版本号只能发一次**，发错版本比发不出去更难收拾。
      - name: 校验 tag 与两处 package.json 版本一致
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.release_tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          $expect = $tag -replace '^v', ''
          foreach ($f in @('./package.json', './packages/engine/package.json')) {
            $version = (node -p "require('$f').version")
            if ($version -ne $expect) {
              Write-Error "tag 是 v$expect，但 $f 的版本是 $version，两处不一致，拒绝发布"
              exit 1
            }
          }

      # 与本机出包同一条命令；tauri build 会签名更新产物（.sig），并跑 NSIS 出安装包
      - name: 出包并签名（产物：安装包 + exe.sig）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri:build

      # 安装包内容门禁：**装完能不能起来**不再只靠人跑探针。exe 静态依赖这 4 个 DLL，
      # 缺任何一个，用户装完就是一个 0xC0000135（2026-10-22 v0.8.4 的真实事故）。
      - name: 安装包内容门禁（4 个 sherpa DLL 必须在包里）
        shell: pwsh
        run: |
          $seven = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path $seven)) { Write-Error '没有 7z，无法核对安装包内容（拒绝空跑）'; exit 1 }
          $v = (node -p "require('./package.json').version")
          $exe = "src-tauri\target\release\bundle\nsis\Modulo_${v}_x64-setup.exe"
          if (-not (Test-Path $exe)) { Write-Error "安装包不在这里：$exe"; exit 1 }
          $list = (& $seven l $exe) -join "`n"
          $need = @('sherpa-onnx-c-api.dll', 'sherpa-onnx-cxx-api.dll', 'onnxruntime.dll', 'onnxruntime_providers_shared.dll')
          $missing = $need | Where-Object { $list -notmatch [regex]::Escape($_) }
          if ($missing) { Write-Error "安装包里缺：$($missing -join '、') —— 装完会起不来（0xC0000135）"; exit 1 }
          '安装包含 4 个 sherpa DLL ✓'

      - name: 生成更新清单 latest.json（含 signedVersion 自检）
        run: node scripts/make-latest-json.mjs

      # 直接用 runner 自带的 gh CLI 挂到 Release，不引入额外第三方 action
      - name: 挂 GitHub Release（安装包 + .sig + latest.json）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = "src-tauri\target\release\bundle\nsis"
          # 文件名里的版本要从 package.json 读，不要写死
          $v = (node -p "require('./package.json').version")
          $exe = "$nsis\Modulo_${v}_x64-setup.exe"
          if (-not (Test-Path $exe)) { Write-Error "出包没出成功：$exe 不在"; exit 1 }
          if (-not (Test-Path "$nsis\Modulo_${v}_x64-setup.exe.sig")) { Write-Error "签名没出来，检查 TAURI_SIGNING_PRIVATE_KEY"; exit 1 }
          if (-not (Test-Path "$nsis\latest.json")) { Write-Error "latest.json 没出来，检查 make-latest-json 是否通过"; exit 1 }
          gh release create "$env:TAG" "$exe" "$nsis\Modulo_${v}_x64-setup.exe.sig" "$nsis\latest.json" --title "Modulo $env:TAG" --draft --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── 引擎包发 npm（trusted publishing / OIDC，2026-10-20 起）──────────────────
      #
      # 位置放在挂 Release **之后**：npm publish **不可撤回**（同名同版本发过就永远发不了第二次），
      # 所以它得是整条链的最后一件事，不能跑在"桌面产物还没出稳"的前面。
      #
      # **2026-10-20：从 NPM_TOKEN（长期凭据）切成 trusted publishing（OIDC）** —— §12.8 的 B 路。
      # 改动三处：① 删掉「查有没有 NPM_TOKEN」与 NODE_AUTH_TOKEN —— 长期 token 不再参与认证
      # （留着它 npm 会一直走 token，OIDC 永远不发生）；② 显式把 npm 升到 ≥11.5.1 ——
      # OIDC 换票在这个版本才有，而本 job 是 `node-version: 22`（自带 npm 10.x），不升的话
      # 发布步会以 ENEEDAUTH / 404 红掉，且报错完全不指向版本（多个迁移实录都踩过这个形状）；
      # ③ `id-token: write` 本 job 早有（provenance 用的就是它），认证复用它，不新增权限。
      #
      # **仓库外的硬前提（不做完这条就打 tag 会红）**：npmjs.com → `@levango7/engine` →
      # Settings → Trusted Publisher 里配好 GitHub Actions（owner `Levango7` + repository `Modulo`
      # + workflow 文件名 `ci.yml`，字段大小写敏感）。配好之前第一个 `v*` tag 会在发布步失败 ——
      # 这是设计：认证不了就不假装发布成功（与本仓其它门「读不到就拒绝通过」同一条原则）。
      # 第一次 tokenless 发布成功后，`NPM_TOKEN` secret 即可删除；另：2027-01 起
      # bypass-2FA 的 granular token 不能再发包，留着它也只是个过期炸弹。
      - name: 升级 npm（trusted publishing 要 ≥ 11.5.1；Node 22 自带 npm 10.x）
        run: npm install -g npm@^11.5.1

      - name: 发 @levango7/engine 到 npm（OIDC 认证，无长期 token）
        # `--provenance` 在 trusted publishing 下是冗余的（出处证明随 OIDC 自动生成），
        # 留着是显式声明意图；它要的 OIDC 与认证同一个令牌，不多要任何东西。
        # 不写进 package.json 的脚本里 —— 本地跑那个脚本不该因为拿不到 OIDC 而失败。
        run: npm run engine:publish -- --provenance

      - name: 保留产物（发布失败时也能从 artifact 拿到）
        uses: actions/upload-artifact@v4
        with:
          name: modulo-release-nsis
          path: |
            src-tauri/target/release/bundle/nsis/
          if-no-files-found: error

  # 网页版部署。**这条 job 存在的理由是它以前根本不存在**：README 的头号入口是
  # https://levango7.github.io/Modulo/（"先试 30 秒，不用装任何东西"），而它一直靠人手 `git push` 到
  # gh-pages —— 于是 0.5.0/0.6.0/0.7.0 三次发版都没人回来推，线上停在 0.4.0（注册表 6 张卡），
  # 仓库里已经 41 张。部署不在任何门禁的射程内，所以它必然漂；把它接进 CI 才是修法，
  # 而不是"下次记得推"。
  web:
    name: 网页版（gh-pages 部署）
    # 与 release 同一档触发：打 tag 或手动派发才部署。分支推送与 PR 不动线上演示
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 站点托管在子路径 /Modulo/ 下，base 必须由环境变量给（vite.config.ts 读 PUBLIC_BASE，默认 '/'）。
      # 忘了带会怎样：网页版在 levango7.github.io 上**白屏**，而本地 `npm run preview` 永远是绿的 ——
      # 这个坑 CHANGELOG 0.1.0 记过一次，所以它写进 CI 而不是只写进注释。
      - name: 构建（PUBLIC_BASE=/Modulo/）
        run: npm run build
        env:
          PUBLIC_BASE: /Modulo/
      # 产物自己证自己：base 没带对时 index.html 引的是 `/assets/...`，站点在
      # levango7.github.io 上会**白屏**，而 `npm run preview` 在本地永远是绿的（子路径这件事
      # 只有部署之后才暴露 —— CHANGELOG 0.1.0 记过同一个坑）。所以推之前先 grep 一行。
      # 顺带一条本机才有的坑：Git Bash 会把 `PUBLIC_BASE=/Modulo/` 里的前导斜杠当成 POSIX 路径
      # 转换掉（实测变成 `/Users/<user>/.qoder/bin/git/Modulo/`），本地复跑这条构建要加
      # `MSYS_NO_PATHCONV=1`；ubuntu runner 上是真 bash，没这个问题。
      - name: 自检：产物必须带 /Modulo/ 前缀
        run: |
          grep -q '/Modulo/assets/' dist/index.html
          echo "产物前缀正确：$(grep -oE 'src="[^"]*"' dist/index.html | head -1)"
      - name: 发布到 gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="$(node -p "require('./package.json').version")"
          git clone --quiet --branch gh-pages --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
          cd pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 整份替换：不清干净的话，历次构建的 index-<hash>.js 会一层层堆在分支上
          find . -mindepth 1 -not -path './.git*' -delete
          cp -r ../dist/. .
          # vite 不产 .nojekyll，而 Pages 的 Jekyll 流水线会吃掉以 `_` 开头的路径 —— 分支上一直带着它
          : > .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "网页版已与 ${v} 的构建产物一致，跳过部署"
            exit 0
          fi
          git commit -q -m "deploy: ${v} 网页版（源 commit ${GITHUB_SHA:0:7}，PUBLIC_BASE=/Modulo/）"
          git push --quiet origin gh-pages
          echo "已部署 ${v}：https://${GITHUB_REPOSITORY#*/}.github.io/${GITHUB_REPOSITORY#*/}/"
