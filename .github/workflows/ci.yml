name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布标签，如 v0.5.0（不填则仅跑常规 CI，不打安装包）'
        required: false
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      # fetch-depth: 0 —— 浅克隆（默认 depth=1）下 `HEAD~1` 与 `origin/master` 都不存在，
      # 协调板门禁的判据 2 每次都会吐一条「拿不到本次提交的改动清单」。
      # **永远消不掉的警告比没有警告更糟**（这条已写进 `coord-gate.mjs` 判据 3 的注释里）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 协调板登记门禁。判据 2（动了产品面却没在板上登记）与判据 4（临时脚本被 git 跟踪）会失败。
      #
      # **2026-10-10 才真正接上**：`bbfa4ec`（#26）只加了 `scripts/coord-gate.mjs`，
      # 从来没有在这里调用过 —— 也就是说它一直是条**永远绿的检查**（不跑 = 不红），
      # 而板上此前那些「coord-gate 0 警告」全是本机手跑的结果。放在最前面跑：
      # 卫生类判据几秒就能红，不必让人等完 5 分钟的构建才看到。
      - name: 协调板登记门禁（未登记改动 / 临时脚本入库 → 红）
        env:
          COORD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/coord-gate.mjs
      - name: 类型检查
        run: npm run typecheck
      - name: 单测 + 投影属性测试（受测层分支覆盖 ≥90% 门禁）
        run: npm run cover:engine
      - name: 构建
        run: npm run build
      # 「抽包」的承诺是"可分发的资产"，不是"目录挪了个位置" —— 包必须能独立构建。
      # 不构建的话 dist/ 永远是空的，等真发 npm 包（prepack 会构建）才发现问题太晚。
      - name: 引擎包独立构建（@levango7/engine）
        run: npm run engine:build
      # 与 x-hub 的反面教材相对：它写了 164 个 Rust 测试，但 CI 只跑 vue-tsc + cargo check，一个测试都不执行
      - name: 浏览器交互 E2E（拖拽 / 框选 / 键盘 / 撤销 / 三档视口）
        run: npm run test:e2e
      # 文档里的规模数字是人抄的，抄错不会让任何测试变红 —— 所以让机器核对。
      # 只认显式标记过的行（`<!-- facts -->`），历史数字与说明段不会被误判。
      # 量的是 dist/ 与 coverage/：coverage 来自上面的门禁步骤；dist 由「构建」产出，
      # 而 E2E 的 globalSetup 又以 production 重建了一遍（vitest.e2e.setup.ts），
      # 所以排在 E2E 之后量到的仍是生产产物。
      - name: 文档数字核对（认领了规模数字的行必须与实跑一致）
        run: npm run docs:check

      # 发布点门禁：验 `v*` tag 的 ruleset 还在、资产字节没变、tag 没被改指。
      # 放在 verify 这个 job 里而不是新开一个 —— master 的 required checks 认的是
      # `verify` 与 `桌面壳` 这两个 context，加 job 就得同步改 ruleset，多一处能忘的地方。
      # 没有 token 时脚本会直接判失败（拒绝假装通过），所以这里不设 continue-on-error。
      # token 必须显式传：Actions **不会**自动把 `github.token` 放进 `GITHUB_TOKEN` 环境变量，
      # 漏了这一行这道门禁会在 CI 上一直红 —— 而那正是它自己的设计（读不到就拒绝通过）。
      - name: 发布点门禁（tag 规则集 / 资产字节 / 出处台账）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-manifest.mjs

  # 桌面壳单独一个 job：它要 Windows runner，跑挂了不该把前端那条链一起标红，反之亦然。
  # 用了两个第三方 action（rust-toolchain / rust-cache），都是事实标准；如果不接受这个依赖，
  # 去掉 rust-cache 只是变慢，去掉 rust-toolchain 则要确认 runner 预装的工具链带 clippy+rustfmt。
  desktop:
    name: 桌面壳（Rust 门禁 + 真打包）
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: 格式检查
        working-directory: src-tauri
        run: cargo fmt --check
      - name: clippy（warning 即失败）
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust 单测（数据文件名的白名单在这里）
        working-directory: src-tauri
        run: cargo test
      - name: 打包出 exe（不打安装包）
        run: npx tauri build --no-bundle
      # 桌面自检探针**不在 CI 跑**（挂过一次，摘了）。实测原因：runner 上 WebView2 的 loader
      # 不把 WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS 写进浏览器进程 —— 6 条 msedgewebview2 命令行
      # 0 条带 --remote-debugging-port（runtime 153.0.4234.48），本机同一颗 exe 是 154.0.4258.53、
      # 命令行带参数且端口可达。于是探针每次都停在"连 CDP"这一步，与产品好坏无关，
      # 留着的价值只是一个不会拦任何东西的红叉。
      # 它的定位是**发布前的本机门禁**：跑在要发出去的那颗二进制上（§11.4），CI 管构建与单测。
      - uses: actions/upload-artifact@v4
        with:
          name: modulo-windows-x64-exe
          path: src-tauri/target/release/modulo.exe
          if-no-files-found: error

  # 发布：打 v* 标签（或手动触发 workflow_dispatch + 有 release-tag 输入）才跑。
  # 设计意图：PR/分支推送**不打安装包**（那一步要 30+ 分钟），只走 verify/desktop；
  # 打 tag 才走 release，把安装包 + 签名 + 更新清单一起产出并挂到 GitHub Release。
  release:
    name: 发布（v* 标签）
    # 只有 tag 推送（或手动触发且显式填了 release_tag）才进来；PR 与分支推送都不跑
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: windows-latest
    timeout-minutes: 60
    # 需要写权限才能用 gh 创建 Release；Secrets 里得先配 TAURI_SIGNING_PRIVATE_KEY。
    # `id-token: write` 是给 npm 的 provenance 用的：它换一张 OIDC 令牌，让 npm 侧
    # 自己签一份"这个包确实从这个仓库的这次 CI 构建出来"的证明，附在包上。
    # 少于这个权限时 `npm publish --provenance` 会直接失败。
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # 只在**这个 job** 里声明 registry-url：setup-node 会据此在 runner 的
          # 用户级 .npmrc 里写一行 `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`，
          # 于是下面那条 `npm publish` 认得 NODE_AUTH_TOKEN。
          # 为什么不把这一行写进仓库那份 .npmrc：那是**每台机器都会读**的文件，
          # 而 token 只在 CI 里存在。发 npm 的凭据不该让本地 `npm install` 也去解析。
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # 版本号对齐先挡一次：tag 必须等于 package.json 里的版本，否则 `make-latest-json`
      # 的 signedVersion 校验也会在出清单前挡。这里少挡一层就是发布一个张冠李戴的版本。
      # 2026-10-09 起多查一处 `packages/engine/package.json` —— 那个包现在会随 tag 发到 npm，
      # 而 npm **同一个版本号只能发一次**，发错版本比发不出去更难收拾。
      - name: 校验 tag 与两处 package.json 版本一致
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.release_tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          $expect = $tag -replace '^v', ''
          foreach ($f in @('./package.json', './packages/engine/package.json')) {
            $version = (node -p "require('$f').version")
            if ($version -ne $expect) {
              Write-Error "tag 是 v$expect，但 $f 的版本是 $version，两处不一致，拒绝发布"
              exit 1
            }
          }

      # 与本机出包同一条命令；tauri build 会签名更新产物（.sig），并跑 NSIS 出安装包
      - name: 出包并签名（产物：安装包 + exe.sig）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri:build

      - name: 生成更新清单 latest.json（含 signedVersion 自检）
        run: node scripts/make-latest-json.mjs

      # 直接用 runner 自带的 gh CLI 挂到 Release，不引入额外第三方 action
      - name: 挂 GitHub Release（安装包 + .sig + latest.json）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = "src-tauri\target\release\bundle\nsis"
          # 文件名里的版本要从 package.json 读，不要写死
          $v = (node -p "require('./package.json').version")
          $exe = "$nsis\Modulo_${v}_x64-setup.exe"
          if (-not (Test-Path $exe)) { Write-Error "出包没出成功：$exe 不在"; exit 1 }
          if (-not (Test-Path "$nsis\Modulo_${v}_x64-setup.exe.sig")) { Write-Error "签名没出来，检查 TAURI_SIGNING_PRIVATE_KEY"; exit 1 }
          if (-not (Test-Path "$nsis\latest.json")) { Write-Error "latest.json 没出来，检查 make-latest-json 是否通过"; exit 1 }
          gh release create "$env:TAG" "$exe" "$nsis\Modulo_${v}_x64-setup.exe.sig" "$nsis\latest.json" --title "Modulo $env:TAG" --draft --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── 引擎包发 npm（2026-10-09 起）────────────────────────────────────────────
      #
      # 位置放在挂 Release **之后**：npm publish **不可撤回**（同名同版本发过就永远发不了第二次），
      # 所以它得是整条链的最后一件事，不能跑在"桌面产物还没出稳"的前面。
      #
      # **没有 NPM_TOKEN 就跳过。** 这条不是贴心，是必要条件：没配 token 的仓库照样能打 tag
      # 发版，而如果这里无条件跑，一推 tag 就红 —— 红的还不是产品问题。
      #
      # 为什么不能直接写 `if: secrets.NPM_TOKEN != ''`：GitHub 在 `steps[*].if` 里
      # **不提供 `secrets` 上下文**（`if` 能用的只有 github / needs / vars / inputs / job /
      # runner / env / steps / strategy / matrix）。写上去不会报错，但求值结果不是我们要的。
      # 所以先在一个 step 里把"有没有"算成 output，再拿 output 当条件。
      - name: 查有没有 NPM_TOKEN
        id: npm-token
        shell: bash
        env:
          # 用 env 传，不把令牌插进脚本正文 —— 插进去等于让令牌成为 shell 代码的一部分
          # （GitHub 会打码，但那管的是日志，不是注入）。
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          echo "have=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::没配 NPM_TOKEN，跳过 @levango7/engine 的发布（桌面产物不受影响）"
          fi

      - name: 发 @levango7/engine 到 npm
        if: steps.npm-token.outputs.have == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # `--provenance` 只在 CI 里有意义（要 OIDC），所以它不写进 package.json 的脚本里
        # —— 本地跑那个脚本不该因为拿不到 OIDC 而失败。
        run: npm run engine:publish -- --provenance

      - name: 保留产物（发布失败时也能从 artifact 拿到）
        uses: actions/upload-artifact@v4
        with:
          name: modulo-release-nsis
          path: |
            src-tauri/target/release/bundle/nsis/
          if-no-files-found: error

  # 网页版部署。**这条 job 存在的理由是它以前根本不存在**：README 的头号入口是
  # https://levango7.github.io/Modulo/（"先试 30 秒，不用装任何东西"），而它一直靠人手 `git push` 到
  # gh-pages —— 于是 0.5.0/0.6.0/0.7.0 三次发版都没人回来推，线上停在 0.4.0（注册表 6 张卡），
  # 仓库里已经 41 张。部署不在任何门禁的射程内，所以它必然漂；把它接进 CI 才是修法，
  # 而不是"下次记得推"。
  web:
    name: 网页版（gh-pages 部署）
    # 与 release 同一档触发：打 tag 或手动派发才部署。分支推送与 PR 不动线上演示
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 站点托管在子路径 /Modulo/ 下，base 必须由环境变量给（vite.config.ts 读 PUBLIC_BASE，默认 '/'）。
      # 忘了带会怎样：网页版在 levango7.github.io 上**白屏**，而本地 `npm run preview` 永远是绿的 ——
      # 这个坑 CHANGELOG 0.1.0 记过一次，所以它写进 CI 而不是只写进注释。
      - name: 构建（PUBLIC_BASE=/Modulo/）
        run: npm run build
        env:
          PUBLIC_BASE: /Modulo/
      # 产物自己证自己：base 没带对时 index.html 引的是 `/assets/...`，站点在
      # levango7.github.io 上会**白屏**，而 `npm run preview` 在本地永远是绿的（子路径这件事
      # 只有部署之后才暴露 —— CHANGELOG 0.1.0 记过同一个坑）。所以推之前先 grep 一行。
      # 顺带一条本机才有的坑：Git Bash 会把 `PUBLIC_BASE=/Modulo/` 里的前导斜杠当成 POSIX 路径
      # 转换掉（实测变成 `/Users/<user>/.qoder/bin/git/Modulo/`），本地复跑这条构建要加
      # `MSYS_NO_PATHCONV=1`；ubuntu runner 上是真 bash，没这个问题。
      - name: 自检：产物必须带 /Modulo/ 前缀
        run: |
          grep -q '/Modulo/assets/' dist/index.html
          echo "产物前缀正确：$(grep -oE 'src="[^"]*"' dist/index.html | head -1)"
      - name: 发布到 gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="$(node -p "require('./package.json').version")"
          git clone --quiet --branch gh-pages --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
          cd pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 整份替换：不清干净的话，历次构建的 index-<hash>.js 会一层层堆在分支上
          find . -mindepth 1 -not -path './.git*' -delete
          cp -r ../dist/. .
          # vite 不产 .nojekyll，而 Pages 的 Jekyll 流水线会吃掉以 `_` 开头的路径 —— 分支上一直带着它
          : > .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "网页版已与 ${v} 的构建产物一致，跳过部署"
            exit 0
          fi
          git commit -q -m "deploy: ${v} 网页版（源 commit ${GITHUB_SHA:0:7}，PUBLIC_BASE=/Modulo/）"
          git push --quiet origin gh-pages
          echo "已部署 ${v}：https://${GITHUB_REPOSITORY#*/}.github.io/${GITHUB_REPOSITORY#*/}/"
